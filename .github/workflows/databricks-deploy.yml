name: Databricks Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-dev:
    name: Validate and Deploy (dev)
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@v0.230.0

      - name: Validate bundle
        run: databricks bundle validate -t dev

      - name: Deploy bundle to dev
        run: databricks bundle deploy -t dev

  deploy-uat:
    name: Validate and Deploy (uat)
    runs-on: ubuntu-latest
    needs: deploy-dev
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@v0.230.0

      - name: Validate bundle
        run: databricks bundle validate -t uat

      - name: Deploy bundle to uat
        run: databricks bundle deploy -t uat

  deploy-prod:
    name: Validate and Deploy (prod)
    runs-on: ubuntu-latest
    needs: deploy-uat
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@v0.230.0

      - name: Validate bundle
        run: databricks bundle validate -t prod

      - name: Deploy bundle to prod
        run: databricks bundle deploy -t prod
